<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Bildirimler</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>

<div style="width:420px;height:560px;box-sizing:border-box;display:flex;flex-direction:column;background:#FFFFFF;border:1px solid #E1E7E2;border-radius:14px;box-shadow:0 16px 40px rgba(19,33,25,0.22);overflow:hidden;font-family:'IBM Plex Sans',sans-serif;color:#132119;">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;flex-shrink:0;">
    <div style="font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;">Bildirimler</div>
    <div style="display:flex;align-items:center;gap:4px;">
      <button onClick="{{onMarkAll}}" style="background:transparent;border:none;font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:600;color:#1E6B3E;cursor:pointer;padding:6px 8px;">Tümünü okundu say</button>
      <button aria-label="Kapat" onClick="{{onClose}}" style="width:30px;height:30px;border-radius:8px;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6B60" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </button>
    </div>
  </div>
  <div style="display:flex;gap:6px;padding:0 16px 10px;border-bottom:1px solid #E9EDEA;flex-shrink:0;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
      <button onClick="{{t.select}}" style="{{t.style}}">{{t.label}}</button>
    </sc-for>
  </div>

  <div style="flex:1;min-height:0;overflow-y:auto;">
    <sc-for list="{{items}}" as="n" hint-placeholder-count="5">
      <div style="{{n.rowStyle}}">
        <span style="{{n.iconStyle}}">
          <sc-if value="{{n.isApproval}}" hint-placeholder-val="{{false}}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9A6B12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          </sc-if>
          <sc-if value="{{n.isRequest}}" hint-placeholder-val="{{false}}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          </sc-if>
          <sc-if value="{{n.isDoc}}" hint-placeholder-val="{{true}}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1E6B3E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path></svg>
          </sc-if>
          <sc-if value="{{n.isDeadline}}" hint-placeholder-val="{{false}}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B23A3A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>
          </sc-if>
        </span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13.5px;line-height:1.45;">{{n.text}}</div>
          <div style="display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:5px;">
            <span style="font-size:11.5px;color:#8A968E;">{{n.time}}</span>
            <sc-for list="{{n.links}}" as="l" hint-placeholder-count="1">
              <a href="{{l.href}}" style="font-size:12.5px;font-weight:600;color:#1E6B3E;text-decoration:underline;">{{l.label}}</a>
            </sc-for>
            <sc-if value="{{n.actionLabel}}" hint-placeholder-val="{{false}}">
              <button onClick="{{n.onAction}}" style="background:transparent;border:none;padding:0;font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:600;color:#1E6B3E;text-decoration:underline;cursor:pointer;">{{n.actionLabel}}</button>
            </sc-if>
          </div>
        </div>
        <sc-if value="{{n.unread}}" hint-placeholder-val="{{true}}">
          <span style="width:8px;height:8px;border-radius:50%;background:#2FA968;flex-shrink:0;margin-top:6px;"></span>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dept":{"editor":"enum","options":["finans","hukuk","enerji","ik","mali","idari","muhasebe"],"default":"finans"},"onClose":{"editor":null},"onOpenTeamChat":{"editor":null},"onOpenBalbal":{"editor":null},"$preview":{"width":420,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const self = this;
    const st = this.state || {};
    const dept = this.props.dept || 'finans';
    const K = 'Sozlesme-Onizleme.dc.html';
    const X = 'Excel-Onizleme.dc.html';
    const C = 'Belge-Bildirim-CED.dc.html';
    const U = 'Belge-Yukle.dc.html';
    const DATA = {
      finans: [
        { id: 'a1', kind: 'approval', text: 'Balbal, Commerzbank Annex F formunu Yeşilova ödeme planından doldurdu. Kontrol edip onaylayın.', time: '10 dk önce', links: [{ label: 'Formu incele ve onayla', href: 'Sablon-Doldur.dc.html' }] },
        { id: 'a0', kind: 'approval', text: 'Balbal, Commerzbank talebine cevap yazısı taslağı hazırladı. Onaylamadan gönderilmez.', time: '25 dk önce', links: [{ label: 'Taslağı aç', href: 'Yazi-Taslagi.dc.html' }] },
        { id: 'a2', kind: 'approval', text: 'Akbank_Faiz_Guncellemesi.pdf için Balbal etiket önerdi (departman, proje, belge türü). Onayınızı bekliyor.', time: '1 saat önce', links: [{ label: 'Öneriyi incele', href: U }] },
        { id: 'r1', kind: 'request', text: 'Enerji departmanından görüş talebi: Güneşalan GES bakım bütçesi aşımı. Son tarih 02.10.2026.', time: 'Dün 16:05', action: 'team', actionLabel: 'Sohbeti aç' },
        { id: 'd1', kind: 'doc', text: 'Mali İşler evrak talebinizi karşıladı: Ticaret_Sicil_Gazetesi_2025.pdf', time: 'Dün 11:20', links: [{ label: 'Belgeyi aç', href: K }, { label: 'İndir', href: K }] },
        { id: 't0', kind: 'deadline', text: 'Commerzbank Ek-F belgeleri için son gün 14.10.2026 (9 gün). Teminat mektubu belgesi hâlâ eksik.', time: 'Bugün 08:00', links: [{ label: 'Talebi aç', href: 'Mail-Talep-Detay.dc.html' }], action: 'balbal', ask: 'Yeşilova için Commerzbank talebinde hangi belgeler eksik?', actionLabel: 'Balbal\'a sor' },
        { id: 't1', kind: 'deadline', text: 'Boztepe_RES_Sigorta_Policesi.pdf 45 gün içinde sona eriyor (10.11.2026).', time: '25.09.2026', links: [{ label: 'Belgeyi aç', href: K }, { label: 'İndir', href: K }], read: true },
        { id: 'd2', kind: 'doc', text: 'Karatepe_RES_Kredi_Tadil_2.pdf sisteme eklendi. Önceki DSCR hükmü artık tarihsel olarak işaretli.', time: '24.09.2026', links: [{ label: 'Belgeyi aç', href: K }, { label: 'İndir', href: K }], read: true }
      ],
      hukuk: [
        { id: 'a1', kind: 'approval', text: 'Balbal, Boztepe davası için süre uzatım dilekçesi taslağını hazırladı. İnceleyip onaylayın.', time: '20 dk önce', links: [{ label: 'Taslağı aç', href: 'Dava-Gecmisi.dc.html' }, { label: 'İndir', href: 'Dava-Gecmisi.dc.html' }] },
        { id: 'd1', kind: 'doc', text: 'Burak Çelik yükledi: Boztepe_Bilirkisi_Raporu.pdf', time: '09:05', links: [{ label: 'Belgeyi aç', href: 'Dava-Gecmisi.dc.html' }, { label: 'İndir', href: 'Dava-Gecmisi.dc.html' }] },
        { id: 'r1', kind: 'request', text: 'Enerji departmanının görüş talebini cevapladınız: Karatepe ÇED yükümlülükleri. Kurumsal hafızaya kaydedildi.', time: '24.09.2026', action: 'team', actionLabel: 'Sohbeti aç', read: true },
        { id: 't1', kind: 'deadline', text: 'Boztepe RES imar davası: sonraki duruşma 28.10.2026.', time: '22.09.2026', links: [{ label: 'Dava dosyası', href: 'Dava-Gecmisi.dc.html' }], read: true }
      ],
      ik: [
        { id: 'k1', kind: 'approval', text: 'Haftalık mevzuat güncellik kontrolü (Pzt 05.10.2026 06:00): 8 kaynak sorgulandı, 3 tanesinde değişiklik şüphesi (kıdem tavanı, asgari ücret, gelir vergisi tarifesi). Onayınız bekleniyor.', time: '06:00', links: [{ label: 'Mevzuat sekmesini aç', href: 'Ana-Sayfa-IK.dc.html' }] },
        { id: 'k2', kind: 'approval', text: 'İzin talebi İK kaydı bekliyor: Burak Çelik · ücretli mazeret · 08.10.2026 · yönetici onayladı.', time: '09:40', links: [{ label: 'İzin Yönetimi', href: 'Ana-Sayfa-IK.dc.html' }] },
        { id: 'k3', kind: 'doc', text: 'Eksik belge: Hakan Tunç işe giriş dosyasında askerlik durum belgesi yok; personele hatırlatma gönderildi.', time: 'Dün 17:10', links: [{ label: 'Personel dosyası', href: 'Ana-Sayfa-IK.dc.html' }] },
        { id: 'k4', kind: 'deadline', text: 'Ekim 2026 bordrosu Finansal Muhasebe\'ye en geç 28.10.2026 iletilmeli.', time: '01.10.2026', links: [{ label: 'Maaş sekmesi (şifreli)', href: 'Ana-Sayfa-IK.dc.html' }] },
        { id: 'k5', kind: 'request', text: 'Enerji: Hakan Tunç için Proje Finans klasörüne çapraz yetki tanımlandı; onay akışı güncellendi.', time: '30.09.2026', action: 'team', actionLabel: 'Sohbeti aç', read: true }
      ],
      idari: [
        { id: 'iz', kind: 'doc', text: 'Varlık listesine eklendi: Logitech Rally Plus + Samsung 75" QM75 · Genel Merkez toplantı salonu (PO-26-044). Yıllık bakım ve garanti tarihleri açıldı.', time: '19.10.2026', links: [{ label: 'İncele', href: 'Ana-Sayfa-Idari.dc.html' }] },
        { id: 'i0', kind: 'doc', text: 'Ödeme listesi: PO-26-044 Toplantı salonu video konferans sistemi · 186.000 TL · tahmini ödeme 12.10.2026.', time: '09.10.2026', links: [{ label: 'İncele', href: 'Ana-Sayfa-Idari.dc.html' }] },
        { id: 'i1', kind: 'doc', text: 'Ödeme listesi: PO-26-042 Haritalama dronu · 168.000 TL · tahmini ödeme 09.10.2026.', time: '08.10.2026', links: [{ label: 'İncele', href: 'Ana-Sayfa-Idari.dc.html' }] },
        { id: 'i2', kind: 'approval', text: 'Yeni satın alma talebi: PO-26-042 Haritalama dronu · Hakan Tunç (EPC).', time: '03.10.2026', links: [{ label: 'İncele', href: 'Ana-Sayfa-Idari.dc.html' }], read: true }
      ],
      muhasebe: [
        { id: 'mu1', kind: 'approval', text: 'Yönlendirilecek fatura: ABC İnşaat A.Ş. · ABC2026000000184 · 2.400.000 USD · Balbal S-26-001 ile eşleştirdi (avans) · itiraz süresi 8 gün.', time: '06.10.2026', links: [{ label: 'İncele', href: 'Ana-Sayfa-Muhasebe.dc.html' }] },
        { id: 'mu2', kind: 'deadline', text: 'İtiraz süresi dolmak üzere: Enercon Servis · ENR2026001121 mükerrer fatura · son gün 07.10.2026.', time: '06.10.2026', links: [{ label: 'İncele', href: 'Ana-Sayfa-Muhasebe.dc.html' }] },
        { id: 'mu3', kind: 'doc', text: 'ERP eşitlemesi: Testo TR · TST-0921 kaydı ERP’de görüldü, kayıt önerisi kapatıldı (PO-26-038).', time: '06.10.2026 09:15', read: true },
        { id: 'mu4', kind: 'approval', text: 'Eşleşmeyen fatura: Hızlı Kargo A.Ş. · KRG-2026-55120 · 1.840 TL · PO/sözleşme yok · Balbal İdari İşler önerdi (%72).', time: '02.10.2026', links: [{ label: 'İncele', href: 'Ana-Sayfa-Muhasebe.dc.html' }] },
        { id: 'mu5', kind: 'deadline', text: 'KDV beyannamesi (Eylül) · 26.10.2026 · 2.310.000 TL · Muhtasar 23.10.2026.', time: '01.10.2026', read: true }
      ],
      mali: [
        { id: 'm1', kind: 'approval', text: 'Ödeme talebi: PO-26-042 Haritalama dronu · 168.000 TL · İdari İşler iletti (Kızılova RES).', time: '08.10.2026', links: [{ label: 'İncele', href: 'Ana-Sayfa-Mali.dc.html' }] },
        { id: 'm2', kind: 'doc', text: 'PO-26-038 Termal kamera · Onur Yıldız teslim aldı; satın alma tamamlandı.', time: '10.10.2026', read: true }
      ],
      enerji: [
        { id: 'od1', kind: 'doc', text: 'Ödeme listesi: PO-26-042 Haritalama dronu · tahmini ödeme 09.10.2026.', time: '08.10.2026' },
        { id: 'izin1', kind: 'approval', text: 'İzin onayı bekliyor: Hakan Tunç · Yıllık izin · 06.10.2026 · 1 gün.', time: '5 dk önce', links: [{ label: 'İncele', href: 'Izin-Talebi.dc.html' }] },
        { id: 'a1', kind: 'approval', text: 'Balbal, EPİAŞ verisinden Eylül üretim raporu taslağını hazırladı (her santral ayrı). Onayınızı bekliyor.', time: '30 dk önce', links: [{ label: 'Raporu aç', href: X }, { label: 'İndir', href: X }] },
        { id: 'd1', kind: 'doc', text: 'Onur Yıldız yükledi: T07_Ariza_Raporu_2609.pdf', time: '08:15', links: [{ label: 'Belgeyi aç', href: C }, { label: 'İndir', href: C }] },
        { id: 'r1', kind: 'request', text: 'Hukuk, ÇED yükümlülükleri görüş talebinizi cevapladı.', time: '24.09.2026', action: 'team', actionLabel: 'Sohbeti aç' },
        { id: 't1', kind: 'deadline', text: 'Karatepe ÇED: ilk kuş göçü izleme raporu Mart 2027’de teslim edilmeli.', time: '20.09.2026', links: [{ label: 'ÇED raporu', href: C }, { label: 'İndir', href: C }], read: true }
      ]
    };
    const list = DATA[dept] || DATA.finans;
    const tab = st.tab || 'all';
    const readAll = !!st.readAll;
    const approvals = list.filter(function (n) { return n.kind === 'approval'; }).length;
    const TAB = "border-radius:14px;padding:5px 12px;font-family:'IBM Plex Sans',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;";
    const tabStyle = function (on) { return TAB + (on ? 'background:#0E241D;color:#F6F7F5;border:1px solid #0E241D;' : 'background:#FFFFFF;color:#5B6B60;border:1px solid #E1E7E2;'); };
    const ICON = 'width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;';
    const ICON_BG = { approval: '#FBF1DE', request: '#E8EFFD', doc: '#E7F3EB', deadline: '#FBE7E7' };
    const items = list.filter(function (n) { return tab === 'all' || n.kind === 'approval'; }).map(function (n) {
      const unread = !readAll && !n.read;
      return {
        text: n.text, time: n.time, links: n.links || [],
        isApproval: n.kind === 'approval', isRequest: n.kind === 'request', isDoc: n.kind === 'doc', isDeadline: n.kind === 'deadline',
        iconStyle: ICON + 'background:' + ICON_BG[n.kind] + ';',
        rowStyle: 'display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid #F0F2F0;' + (unread ? 'background:#F6FBF8;' : 'background:#FFFFFF;'),
        unread: unread,
        actionLabel: n.actionLabel || null,
        onAction: function () {
          if (n.action === 'team' && self.props.onOpenTeamChat) self.props.onOpenTeamChat();
          if (n.action === 'balbal' && self.props.onOpenBalbal) self.props.onOpenBalbal(n.ask || '');
        }
      };
    });
    return {
      tabs: [
        { label: 'Tümü', style: tabStyle(tab === 'all'), select: function () { self.setState({ tab: 'all' }); } },
        { label: 'Onayımı bekleyen (' + approvals + ')', style: tabStyle(tab === 'approval'), select: function () { self.setState({ tab: 'approval' }); } }
      ],
      items: items,
      onMarkAll: function () { self.setState({ readAll: true }); },
      onClose: this.props.onClose || function () {}
    };
  }
}
</script>
</body>
</html>
